<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面走丢了｜何紫瑶</title>
  <link rel="icon" href="/heziyao/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"Noto Serif SC";src:url("/heziyao/assets/fonts/noto-serif-sc-600.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"Noto Sans SC";src:url("/heziyao/assets/fonts/noto-sans-sc-400.woff2") format("woff2");font-weight:400;font-display:swap}
    :root{--paper:#f8f4ea;--surface:#fffdf8;--ink:#2e3a31;--muted:#778177;--sage:#3c5747;--sage-mist:#eef3ea;--clay:#c08463;--line:#e4ddcf;--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 500px at 12% 8%,rgba(192,132,99,.12),transparent 62%),radial-gradient(700px 600px at 90% 10%,rgba(111,138,116,.14),transparent 62%),var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75}
    .card{width:min(620px,100%);padding:48px 42px;border:1px solid var(--line);border-radius:32px;background:rgba(255,253,248,.86);box-shadow:0 30px 70px rgba(50,66,54,.1);text-align:center}
    .mark{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:var(--sage-mist);color:var(--sage)}
    .mark svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .kicker{margin:0;color:var(--clay);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:12px 0 12px;font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:600;line-height:1.4}
    p{margin:0 auto;max-width:380px;color:var(--muted);font-size:13px}
    a{display:inline-flex;align-items:center;gap:7px;margin-top:26px;padding:12px 22px;border-radius:999px;background:var(--sage);color:#fffaf0;font-size:12px;text-decoration:none;transition:transform .2s}
    a:hover{transform:translateY(-2px)}
    a svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:520px){.card{padding:34px 24px;border-radius:24px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 14c-5 0-8-2.6-9-7 5-.7 8.4 1.9 9 7Z"/><path d="M12 12c.7-5 3.3-7.6 8-8 .6 5-2.6 7.7-8 8Z"/><path d="M7 21h10"/></svg>
    </div>
    <p class="kicker">404 · PAGE NOT FOUND</p>
    <h1>这一页，去别处长大啦。</h1>
    <p>你访问的页面可能已经移动或不存在。回到首页，继续看看我的实践与成长。</p>
    <a href="/heziyao/">
      回到首页
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </a>
  </main>
</body>
</html>
